<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MiauAPI - Menu Framework</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Inter,sans-serif}
body{background:transparent}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

.menu-root{position:absolute;left:2vh;top:2vh;width:36vh;max-height:42vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 50%,#0f0f0f 100%);border-radius:1.2vh;border:1px solid rgba(139,92,246,.15);overflow:hidden;box-shadow:0 0 3vh rgba(139,92,246,.15)}
.menu-header{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(168,85,247,.08));padding:1.2vh 1.6vh;text-align:center;border-bottom:1px solid rgba(139,92,246,.12);cursor:move;user-select:none}
.menu-header h1{color:#8b5cf6;font-size:1.6vh;font-weight:600;letter-spacing:.5px;text-shadow:0 0 1vh rgba(139,92,246,.2)}
.menu-body{display:flex;flex:1;min-height:0}
.menu-tabs{width:9vh;flex-shrink:0;background:rgba(0,0,0,.3);padding:.6vh 0;border-right:1px solid rgba(139,92,246,.1)}
.tab-btn{display:block;width:100%;padding:.7vh .6vh;background:transparent;border:none;color:rgba(255,255,255,.5);font-size:1.1vh;text-align:center;cursor:pointer;transition:all .2s;position:relative;font-family:inherit}
.tab-btn:hover{color:#fff;background:rgba(139,92,246,.1)}
.tab-btn.active{color:#8b5cf6;background:rgba(139,92,246,.12)}
.tab-btn.active::before{content:'';position:absolute;left:0;top:15%;height:70%;width:2px;background:#8b5cf6;border-radius:0 2px 2px 0}
.menu-content{flex:1;overflow-y:auto;padding:.6vh .8vh;min-height:20vh;max-height:38vh}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:.55vh .6vh;margin:.15vh 0;border-radius:.4vh;cursor:pointer;transition:all .15s;min-height:2.6vh}
.menu-item:hover{background:rgba(139,92,246,.08)}
.menu-item .label{color:#fff;font-size:1.2vh;font-weight:400;flex:1}
.btn-item{justify-content:center}
.btn-item .label{text-align:center;color:#c084fc;font-weight:500;font-size:1.2vh}
.btn-item:hover{background:rgba(139,92,246,.15)}
.btn-item:hover .label{color:#8b5cf6}
.toggle-track{width:2.8vh;height:1.4vh;background:rgba(255,255,255,.15);border-radius:.7vh;position:relative;transition:all .25s;flex-shrink:0}
.toggle-track.on{background:rgba(139,92,246,.5)}
.toggle-knob{position:absolute;top:.15vh;left:.15vh;width:1.1vh;height:1.1vh;background:#fff;border-radius:50%;transition:all .25s;box-shadow:0 .1vh .2vh rgba(0,0,0,.3)}
.toggle-track.on .toggle-knob{left:calc(100% - 1.25vh);background:#8b5cf6}
.slider-container{padding:.4vh 0;flex-direction:column;align-items:stretch!important}
.slider-container .label{margin-bottom:.25vh}
.slider-row{display:flex;align-items:center;gap:.6vh}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:.3vh;border-radius:.15vh;background:rgba(139,92,246,.3);outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.2vh;height:1.2vh;border-radius:50%;background:#8b5cf6;cursor:pointer;box-shadow:0 0 .4vh rgba(139,92,246,.4)}
.slider-value{color:#c084fc;font-size:1.1vh;min-width:2.5vh;text-align:right;font-weight:500}
.notification-container{position:fixed;bottom:2vh;right:2vh;z-index:9999;display:flex;flex-direction:column-reverse;gap:.5vh}
.notif{background:rgba(15,15,15,.92);border-left:3px solid #8b5cf6;padding:.8vh 1.2vh;border-radius:.4vh;color:#fff;font-size:1.2vh;max-width:30vh;animation:notifIn .3s ease,notifOut .3s ease 4.7s forwards;box-shadow:0 .2vh 1vh rgba(0,0,0,.4)}
.notif.error{border-left-color:#ef4444}
.notif.success{border-left-color:#10b981}
.notif.warning{border-left-color:#f59e0b}
@keyframes notifIn{from{opacity:0;transform:translateX(3vh)}to{opacity:1;transform:translateX(0)}}
@keyframes notifOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(3vh)}}
.player-list{position:fixed;right:2vh;top:50%;transform:translateY(-50%);width:18vh;max-height:40vh;background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 50%,#0f0f0f 100%);border-radius:1vh;border:1px solid rgba(139,92,246,.12);overflow-y:auto;padding:.4vh 0}
.player-item{display:flex;align-items:center;padding:.5vh .8vh;color:rgba(255,255,255,.7);font-size:1vh;cursor:pointer;transition:all .1s;justify-content:space-between}
.player-item:hover{background:rgba(139,92,246,.1);color:#fff}
.player-item.selected{background:rgba(139,92,246,.15);color:#8b5cf6}
.player-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-item .dist{color:rgba(255,255,255,.35);font-size:.9vh;margin-left:.4vh}
.player-item .status{font-size:.9vh;margin-left:.4vh}
.player-item .status.dead{color:#ef4444}
.player-item .status.alive{color:#10b981}
</style>
</head>
<body>

<div class="notification-container" id="notifContainer"></div>
<div class="menu-root" id="menuRoot">
  <div class="menu-header"><h1>MIAU MENU</h1></div>
  <div class="menu-body">
    <div class="menu-tabs" id="tabContainer"></div>
    <div class="menu-content" id="contentContainer"></div>
  </div>
</div>
<div class="player-list" id="playerList" style="display:none"></div>

<script>
var menuRoot = document.getElementById('menuRoot');
var tabContainer = document.getElementById('tabContainer');
var contentContainer = document.getElementById('contentContainer');
var notifContainer = document.getElementById('notifContainer');
var playerListEl = document.getElementById('playerList');

var menuData = null;
var activeTab = null;
var isInGame = false;

var dragTarget = null, dragOffX = 0, dragOffY = 0;
var header = menuRoot.querySelector('.menu-header');
header.addEventListener('mousedown', function(e) {
  dragTarget = menuRoot;
  dragOffX = e.clientX - menuRoot.offsetLeft;
  dragOffY = e.clientY - menuRoot.offsetTop;
});
document.addEventListener('mousemove', function(e) {
  if (!dragTarget) return;
  dragTarget.style.left = (e.clientX - dragOffX) + 'px';
  dragTarget.style.top = (e.clientY - dragOffY) + 'px';
});
document.addEventListener('mouseup', function() { dragTarget = null; });

function notify(msg, type) {
  var el = document.createElement('div');
  el.className = 'notif' + (type ? ' ' + type : '');
  el.textContent = msg;
  notifContainer.appendChild(el);
  setTimeout(function() { el.remove(); }, 5000);
}

function sendAction(action, data) {
  if (!isInGame) return;
  var body = JSON.stringify(Object.assign({ action: action }, data));
  fetch('http://localhost/menuClick', {
    method: 'POST',
    body: body,
    headers: { 'Content-Type': 'application/json' }
  }).catch(function(){});
}

function renderTabs() {
  if (!menuData || !menuData.tabs) return;
  tabContainer.innerHTML = '';
  menuData.tabs.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.id === activeTab ? ' active' : '');
    btn.textContent = t.text || t.id;
    btn.dataset.id = t.id;
    btn.onclick = function() {
      activeTab = t.id;
      renderTabs();
      renderContent();
    };
    tabContainer.appendChild(btn);
  });
}

function renderContent() {
  contentContainer.innerHTML = '';
  if (!menuData || !menuData.tabs) return;
  var tab = null;
  for (var i = 0; i < menuData.tabs.length; i++) {
    if (menuData.tabs[i].id === activeTab) { tab = menuData.tabs[i]; break; }
  }
  if (!tab || !tab.items) return;
  tab.items.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'menu-item';
    if (item.type === 'button') {
      div.classList.add('btn-item');
      var span = document.createElement('span');
      span.className = 'label';
      span.textContent = item.label;
      div.appendChild(span);
      div.onclick = function() { sendAction('buttonClick', { id: item.id, tab: activeTab }); };
    } else if (item.type === 'checkbox' || item.type === 'toggle') {
      var span = document.createElement('span');
      span.className = 'label';
      span.textContent = item.label;
      div.appendChild(span);
      var track = document.createElement('div');
      track.className = 'toggle-track' + (item.value ? ' on' : '');
      var knob = document.createElement('div');
      knob.className = 'toggle-knob';
      track.appendChild(knob);
      div.appendChild(track);
      div.onclick = function() {
        var newVal = !item.value;
        item.value = newVal;
        track.className = 'toggle-track' + (newVal ? ' on' : '');
        sendAction('toggleChange', { id: item.id, tab: activeTab, value: newVal });
      };
    } else if (item.type === 'slider') {
      div.classList.add('slider-container');
      var span = document.createElement('span');
      span.className = 'label';
      span.textContent = item.label;
      div.appendChild(span);
      var row = document.createElement('div');
      row.className = 'slider-row';
      var input = document.createElement('input');
      input.type = 'range';
      input.min = item.min || 0;
      input.max = item.max || 100;
      input.value = item.value || 50;
      var val = document.createElement('span');
      val.className = 'slider-value';
      val.textContent = Math.round(input.value);
      row.appendChild(input);
      row.appendChild(val);
      div.appendChild(row);
      var timer = null;
      input.oninput = function() {
        val.textContent = input.value;
        if (timer) clearTimeout(timer);
        timer = setTimeout(function() {
          sendAction('sliderChange', { id: item.id, tab: activeTab, value: parseFloat(input.value) });
        }, 150);
      };
    }
    contentContainer.appendChild(div);
  });
}

function renderPlayerList(players) {
  if (!players || players.length === 0) { playerListEl.style.display = 'none'; return; }
  playerListEl.style.display = 'block';
  playerListEl.innerHTML = '';
  players.forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'player-item' + (p.selected ? ' selected' : '');
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = p.name;
    div.appendChild(name);
    if (p.distance !== undefined) {
      var d = document.createElement('span');
      d.className = 'dist';
      d.textContent = p.distance + 'm';
      div.appendChild(d);
    }
    if (p.status) {
      var s = document.createElement('span');
      s.className = 'status ' + (p.status === 'dead' ? 'dead' : 'alive');
      s.textContent = p.status === 'dead' ? '[M]' : '[V]';
      div.appendChild(s);
    }
    div.onclick = function() {
      sendAction('playerSelect', { id: p.id });
      document.querySelectorAll('.player-item').forEach(function(el) { el.classList.remove('selected'); });
      div.classList.add('selected');
    };
    playerListEl.appendChild(div);
  });
}

function loadDemoData() {
  menuData = {
    tabs: [
      { id: "Jogador", text: "Jogador", items: [
        { type: "toggle", id: "Godmod", label: "GodMod", value: false },
        { type: "button", id: "Reviver", label: "Reviver" },
        { type: "button", id: "Suicidio", label: "Suicidio" },
        { type: "toggle", id: "Noclip", label: "Noclip", value: false },
        { type: "toggle", id: "Invisivel", label: "Invisível", value: false },
        { type: "toggle", id: "Modo Flash", label: "Modo Flash", value: false },
        { type: "toggle", id: "WallGhost", label: "WallGhost", value: false },
        { type: "button", id: "TPWaypoint", label: "TPWaypoint" },
        { type: "toggle", id: "NoRagdoll", label: "NoRagdoll", value: false },
        { type: "toggle", id: "CameraLivre", label: "CameraLivre", value: false }
      ]},
      { id: "Veiculos", text: "Veículos", items: [
        { type: "button", id: "Reparar Veiculo", label: "Reparar Veículo" },
        { type: "button", id: "Trancar Veiculo", label: "Trancar Veículo" },
        { type: "button", id: "Destrancar Veiculo", label: "Destrancar Veículo" },
        { type: "button", id: "Tunar no Máximo", label: "Tunar no Máximo" }
      ]},
      { id: "Armas", text: "Armas", items: [
        { type: "button", id: "Pistola MK2", label: "Pistola MK2" },
        { type: "button", id: "Remover armas", label: "Remover Armas" },
        { type: "toggle", id: "Munição Infinita", label: "Munição Infinita", value: false }
      ]},
      { id: "Visual", text: "Visual", items: [
        { type: "toggle", id: "ESP Nome", label: "ESP Nome", value: false },
        { type: "toggle", id: "ESP Skeletons", label: "ESP Skeletons", value: false },
        { type: "toggle", id: "ESP Box", label: "ESP Box", value: false },
        { type: "toggle", id: "ESP ADM", label: "ESP ADM (Invisível)", value: false }
      ]}
    ]
  };
  activeTab = "Jogador";
  renderTabs();
  renderContent();
}

try {
  if (window.self !== window.top) {
    isInGame = true;
  } else {
    isInGame = false;
    loadDemoData();
  }
} catch(e) {
  isInGame = false;
  loadDemoData();
}

window.addEventListener('message', function(event) {
  var data = event.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch(e) { return; }
  }
  if (!data || !data.action) return;
  isInGame = true;
  switch (data.action) {
    case 'showMenu':
      menuData = data.menu;
      activeTab = data.menu && data.menu.tabs && data.menu.tabs[0] ? data.menu.tabs[0].id : null;
      renderTabs();
      renderContent();
      break;
    case 'notify':
      notify(data.message, data.type);
      break;
    case 'updateStates':
      if (data.states && menuData && menuData.tabs) {
        menuData.tabs.forEach(function(tab) {
          if (tab.items) {
            tab.items.forEach(function(item) {
              if ((item.type === 'checkbox' || item.type === 'toggle') && data.states[item.id] !== undefined) {
                item.value = data.states[item.id];
              }
              if (item.type === 'slider' && data.states[item.id] !== undefined) {
                item.value = data.states[item.id];
              }
            });
          }
        });
        if (activeTab) renderContent();
      }
      break;
    case 'updatePlayerList':
      renderPlayerList(data.players);
      break;
  }
});
</script>
</body>
</html>
